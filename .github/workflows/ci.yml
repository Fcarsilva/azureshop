name: AzureShop CI/CD

on:
  push:
    branches: [lab4-appservice]
  pull_request:
    branches: [lab4-appservice]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name == 'push'
        run: az acr login --name acrimersaoazshopau

      - name: Build and Push Docker image
        if: github.event_name == 'push'
        run: |
          docker build -t acrimersaoazshopau.azurecr.io/azure-shop:lab13-demo .
          docker push acrimersaoazshopau.azurecr.io/azure-shop:lab13-demo
